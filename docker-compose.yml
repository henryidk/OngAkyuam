services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # URL interna: el contenedor habla con "postgres"/"redis" por nombre de servicio,
      # no con el 127.0.0.1:${POSTGRES_PORT}/${REDIS_PORT} que se usa para herramientas locales (ver .env.example).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    expose:
      - "${API_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${API_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Bindeado a 127.0.0.1: la arquitectura de producción decidida en CLAUDE.md
    # pone nginx-proxy + acme-companion como el único servicio que publica 80/443
    # al host (0.0.0.0), detrás de Cloudflare. Ese proxy todavía no existe en este
    # repo — se construye aparte (necesita dominio real, IPs de Cloudflare para el
    # firewall, config de acme-companion). Mientras tanto, este bind a localhost
    # deja probar el build de producción de "web" en local sin exponerlo a la red,
    # y evita que "80:80" quede accidentalmente como la exposición real si alguien
    # despliega este compose tal cual antes de que el proxy esté listo.
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
