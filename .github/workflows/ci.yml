name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @akyuam/shared build

      - run: pnpm --filter @akyuam/api exec prisma generate

      - name: Lint api
        run: pnpm --filter @akyuam/api exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Lint web
        run: pnpm --filter @akyuam/web lint

      - run: pnpm --filter @akyuam/api build

      - run: pnpm --filter @akyuam/web build

      - name: Test api (unit)
        run: pnpm --filter @akyuam/api test
